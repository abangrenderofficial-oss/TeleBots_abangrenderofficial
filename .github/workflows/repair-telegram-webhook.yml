name: Repair Telegram Webhook

on:
  push:
    branches: [main]

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Vercel production, repair webhook, and apply one-time caption fix
        shell: bash
        run: |
          set -e
          URL="https://tele-bots-abangrenderofficial.vercel.app/api/repair-webhook"
          PATCH_URL="https://tele-bots-abangrenderofficial.vercel.app/api/telegram-command?manual_patch=m64_20260912_kQ9vP7xN4sT2cR8w"
          for i in {1..12}; do
            echo "Attempt $i"
            code=$(curl -sS -o /tmp/body.txt -w "%{http_code}" -X POST "$URL" || true)
            cat /tmp/body.txt || true
            echo
            if [ "$code" = "200" ]; then
              patch_code=$(curl -sS -o /tmp/patch.txt -w "%{http_code}" "$PATCH_URL" || true)
              cat /tmp/patch.txt || true
              echo
              if [ "$patch_code" = "200" ] && grep -q '"group_updated":true' /tmp/patch.txt; then
                exit 0
              fi
            fi
            sleep 10
          done
          echo "Webhook repair or one-time caption patch did not complete in time"
          exit 1
