name: Telegram link importer test

on:
  push:
    branches:
      - feature/telegram-link-import
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Node dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run existing test suite
        run: npm test

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install MTProto probe dependencies
        run: pip install --disable-pip-version-check -q pyrogram tgcrypto

      - name: Check Telegram MTProto secret availability
        id: tgsecrets
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          STRING: ${{ secrets.STRING }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        shell: bash
        run: |
          [[ -n "$API_ID" ]] && api_id=true || api_id=false
          [[ -n "$API_HASH" ]] && api_hash=true || api_hash=false
          [[ -n "$STRING" ]] && string=true || string=false
          [[ -n "$TELEGRAM_BOT_TOKEN" || -n "$BOT_TOKEN" ]] && bot_token=true || bot_token=false
          echo "api_id=$api_id" >> "$GITHUB_OUTPUT"
          echo "api_hash=$api_hash" >> "$GITHUB_OUTPUT"
          echo "string=$string" >> "$GITHUB_OUTPUT"
          echo "bot_token=$bot_token" >> "$GITHUB_OUTPUT"
          echo "API_ID configured: $api_id"
          echo "API_HASH configured: $api_hash"
          echo "STRING configured: $string"
          echo "Bot token configured: $bot_token"

      - name: Probe dummy post using authenticated user session
        if: steps.tgsecrets.outputs.api_id == 'true' && steps.tgsecrets.outputs.api_hash == 'true' && steps.tgsecrets.outputs.string == 'true'
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          STRING: ${{ secrets.STRING }}
        run: |
          python - <<'PY'
          import asyncio, os, tempfile
          from pyrogram import Client

          async def main():
              app = Client(
                  'telegram-link-import-probe',
                  api_id=int(os.environ['API_ID']),
                  api_hash=os.environ['API_HASH'],
                  session_string=os.environ['STRING'],
                  in_memory=True,
              )
              await app.start()
              try:
                  msg = await app.get_messages('free3dsky', 29983)
                  if not msg or getattr(msg, 'empty', False):
                      raise RuntimeError('MTProto returned an empty message')
                  kinds = []
                  for name in ('photo','video','document','audio','animation','voice','video_note','sticker'):
                      if getattr(msg, name, None):
                          kinds.append(name)
                  print('MESSAGE_ID', msg.id)
                  print('MEDIA_KINDS', ','.join(kinds) or 'none')
                  print('HAS_TEXT', bool(msg.text or msg.caption))
                  if not msg.media:
                      raise RuntimeError('Dummy post has no downloadable media')
                  with tempfile.TemporaryDirectory() as tmp:
                      path = await app.download_media(msg, file_name=tmp + '/')
                      if not path or not os.path.exists(path):
                          raise RuntimeError('download_media returned no file')
                      print('DOWNLOADED', os.path.basename(path), os.path.getsize(path))
              finally:
                  await app.stop()

          asyncio.run(main())
          PY

      - name: Probe dummy post using MTProto bot auth
        if: steps.tgsecrets.outputs.api_id == 'true' && steps.tgsecrets.outputs.api_hash == 'true' && steps.tgsecrets.outputs.string != 'true' && steps.tgsecrets.outputs.bot_token == 'true'
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          python - <<'PY'
          import asyncio, os
          from pyrogram import Client

          async def main():
              token = os.environ.get('TELEGRAM_BOT_TOKEN') or os.environ.get('BOT_TOKEN')
              app = Client(
                  'telegram-link-bot-probe',
                  api_id=int(os.environ['API_ID']),
                  api_hash=os.environ['API_HASH'],
                  bot_token=token,
                  in_memory=True,
              )
              await app.start()
              try:
                  msg = await app.get_messages('free3dsky', 29983)
                  print('BOT_MTPROTO_MESSAGE', bool(msg and not getattr(msg, 'empty', False)))
                  if not msg or getattr(msg, 'empty', False):
                      raise RuntimeError('MTProto bot auth could not read dummy post')
              finally:
                  await app.stop()

          asyncio.run(main())
          PY

      - name: Report missing MTProto setup
        if: steps.tgsecrets.outputs.api_id != 'true' || steps.tgsecrets.outputs.api_hash != 'true'
        run: echo 'MTProto probe skipped because API_ID/API_HASH are not configured as GitHub secrets.'
