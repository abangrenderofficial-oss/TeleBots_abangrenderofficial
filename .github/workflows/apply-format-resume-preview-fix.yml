name: Apply Format Resume Preview Fix

on:
  push:
    branches: [fix/format-resume-preview-isolation]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[patch-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/format-resume-preview-isolation
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply resilient preview + failed queue retry patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          media = Path('lib/bot/features/media.js')
          s = media.read_text()
          old = """    for (const row of waiting) {\n      if (await isFormatPipelinePaused(chatId)) break;\n      if (String(row.status || '').toUpperCase() === 'PENDING') break;\n      await sendPreview(row.id, chatId);\n    }\n"""
          new = """    for (const row of waiting) {\n      if (await isFormatPipelinePaused(chatId)) break;\n      if (String(row.status || '').toUpperCase() === 'PENDING') break;\n      try {\n        await sendPreview(row.id, chatId);\n      } catch (error) {\n        // Preview delivery is UI-only. A broken/missing Telegram source message\n        // must never poison the caption processing status of a different item.\n        // Stop here to preserve preview order, but do not throw into the active\n        // recaption/resume worker. Future flushes can retry this exact preview.\n        console.error('Ordered preview delivery failed:', error?.message || error);\n        await updateQueueItem(row.id, {\n          error_message: `Preview delivery failed: ${String(error?.message || error).slice(0, 700)}`,\n        }).catch(() => {});\n        break;\n      }\n    }\n"""
          if old not in s:
              raise SystemExit('media preview loop target not found')
          media.write_text(s.replace(old, new, 1))

          resume = Path('lib/bot/features/format-resume.js')
          s = resume.read_text()
          old = ".filter((row) => String(row.status || '').toUpperCase() === 'PENDING')"
          new = ".filter((row) => ['PENDING', 'FAILED'].includes(String(row.status || '').toUpperCase()))"
          if old not in s:
              raise SystemExit('format resume status target not found')
          resume.write_text(s.replace(old, new, 1))

          test = Path('tests/recaption-sync.test.mjs')
          s = test.read_text()
          s = s.replace(
              "{ id: 'q2', admin_chat_id: '42', source_chat_id: '42', source_message_id: 102, status: 'PENDING', created_at: '2026-09-12T10:00:03Z' },",
              "{ id: 'q2', admin_chat_id: '42', source_chat_id: '42', source_message_id: 102, status: 'FAILED', created_at: '2026-09-12T10:00:03Z' },",
              1,
          )
          anchor = """test('media pipeline queues later uploads while format review is paused', async () => {\n"""
          extra = """test('ordered preview failure is isolated from caption resume processing', async () => {\n  const source = await readFile(new URL('../lib/bot/features/media.js', import.meta.url), 'utf8');\n  assert.match(source, /Ordered preview delivery failed:/);\n  assert.match(source, /Preview delivery failed:/);\n  assert.match(source, /Future flushes can retry this exact preview/);\n});\n\n"""
          if anchor not in s:
              raise SystemExit('test insertion anchor not found')
          test.write_text(s.replace(anchor, extra + anchor, 1))
          PY
      - name: Test
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm test
      - name: Commit patch
        shell: bash
        run: |
          git config user.name abangrenderofficial-oss
          git config user.email abangrenderofficial@gmail.com
          git add lib/bot/features/media.js lib/bot/features/format-resume.js tests/recaption-sync.test.mjs
          git commit -m "[patch-applied] Isolate preview failures during format resume"
          git push origin HEAD:fix/format-resume-preview-isolation
